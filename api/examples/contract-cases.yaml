  - id: C-UE-03
    schema: UserEvidenceInput
    valid: false
    note: INTERIOR_FEATURE_MATCH 只列 1 個特徵
    data: { field: listing_identity, value: { listing_id: 11 }, description: 室內特徵比對, observed_at: '2026-11-01T06:00:00Z', evidence_role: LISTING_LINKAGE, derivation_type: ORIGINAL, capture: *photo_capture, link_method: INTERIOR_FEATURE_MATCH, linked_listing: { listing_id: 11, listing_ref_seen: '591#123456' }, matched_features: [大理石牆] }
  - id: C-UE-04
    schema: UserEvidenceInput
    valid: false
    note: 覆核引用（REVIEW_CITATION）沒有 derived_from
    data: { field: full_address, value: { address_text: 高鐵南路一段79號12樓 }, description: 引用先前的門牌照片, observed_at: '2026-11-02T06:00:00Z', evidence_role: DIRECT_ADDRESS, derivation_type: REVIEW_CITATION }
  - id: C-UE-05
    schema: UserEvidenceInput
    valid: false
    note: derived_from 只有整數 ID，沒有型別
    data: { field: full_address, value: { address_text: 高鐵南路一段79號12樓 }, description: 引用先前的門牌照片, observed_at: '2026-11-02T06:00:00Z', evidence_role: DIRECT_ADDRESS, derivation_type: REVIEW_CITATION, derived_from: [901] }
  - id: C-UE-06
    schema: UserEvidenceInput
    valid: true
    note: 第二次覆核引用同一張照片（具型別參照）；根來源沿用照片的根來源，不增加獨立來源數（T-EVD-06）
    data: { field: full_address, value: { address_text: 高鐵南路一段79號12樓 }, description: 引用先前的門牌照片, observed_at: '2026-11-02T06:00:00Z', evidence_role: DIRECT_ADDRESS, derivation_type: REVIEW_CITATION, derived_from: [{ ref_type: EVIDENCE, id: 901, role: CITES }] }

  # ---------------- SupportAssessment / FieldResolution ----------------
  - id: C-SA-01
    schema: SupportAssessment
    valid: true
    note: 只有門牌照片，沒有刊登連結（T-ADDR-09c）
    data: { result: INSUFFICIENT, unmet_conditions: [H2], confirmed_fields: [] }
  - id: C-SA-02
    schema: SupportAssessment
    valid: false
    note: SUFFICIENT 卻列出未達成條件
    data: { result: SUFFICIENT, unmet_conditions: [H2], confirmed_fields: [full_address] }
  - id: C-SA-03
    schema: SupportAssessment
    valid: false
    note: INSUFFICIENT 卻確認了欄位
    data: { result: INSUFFICIENT, unmet_conditions: [H1], confirmed_fields: [full_address] }
  - id: C-FRS-01
    schema: FieldResolution
    valid: false
    note: CONFIRMED 沒有 basis
    data: { status: CONFIRMED, value: 高鐵南路一段79號12樓, basis: null, evidence_ids: [901] }
  - id: C-FRS-02
    schema: FieldResolution
