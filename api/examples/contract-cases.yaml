# 契約案例：每一筆都指定 components.schemas 中的 schema，以及預期是否合法。
# 用途：(1) 文件範例；(2) 日後契約測試的固定資料。本階段只用 jsonschema 做離線驗證（見 docs/15）。
# 注意：這裡只驗證 schema（結構、必填、條件必填）。「佐證是否充分」「來源是否獨立」等業務規則由伺服器判定，
#       對應 docs/10 的業務測試（規劃中，尚未執行），不在這裡宣稱通過。
# 資料是虛構的測試資料；號碼取自【先前轉錄・待核對】的對照，只當格式示例。
# v0.3：所有事件加上 notify_eligible／suppression_reason；新增人工確認、推導規則、來源獨立性、初始化通知相關案例。

envelope_defaults:
  nocause: &nocause { fetch_run_id: null, snapshot_id: null, operation_id: null, review_id: null, assessment_id: null }
  photo_capture: &photo_capture { captured_by: user, captured_at: '2026-11-01T06:00:00Z', method: PHOTO }
  visit_capture: &visit_capture { captured_by: user, captured_at: '2026-11-01T06:00:00Z', method: SITE_VISIT_NOTE }
  user_party: &user_party { type: USER, key: user }

cases:
  # ---------------- ListingCreate ----------------
  - id: C-LC-01
    schema: ListingCreate
    valid: true
    note: SRC-MANUAL，沒有 external_id 與 url → 伺服器產生 man_<ULID>
    data:
      source_code: SRC-MANUAL
      import_mode: INCREMENTAL
      evidence_origin: { origin_source_code: SRC-591, url: null, note: 使用者瀏覽後記錄 }
      snapshot: { total_price: 15800000, building_ping: 45.2, floor_text: 12F/24F, rooms: 3, halls: 2, baths: 2 }
  - id: C-LC-02
    schema: ListingCreate
    valid: true
    note: 平台來源，只有 external_id
    data:
      source_code: SRC-591
      external_id: '123456'
      snapshot: { total_price: 15800000 }
  - id: C-LC-03
    schema: ListingCreate
    valid: false
    note: 平台來源沒有 external_id，也沒有 url
    data:
      source_code: SRC-LEJU
      snapshot: { total_price: 15800000 }
  - id: C-LC-04
    schema: ListingCreate
    valid: false
    note: 平台來源 url 為 null，也沒有 external_id
    data:
      source_code: SRC-591
      url: null
      snapshot: { total_price: 15800000 }
  - id: C-LC-05
    schema: ListingCreate
    valid: false
    note: SRC-MANUAL 沒有附原始出處
    data:
      source_code: SRC-MANUAL
      snapshot: { total_price: 15800000 }
  - id: C-LC-06
    schema: ListingCreate
    valid: false
    note: 快照有未定義欄位
    data:
      source_code: SRC-591
      external_id: '1'
      snapshot: { total_price: 15800000, lister_phone: '0912xxxxxx' }
  - id: C-LC-07
    schema: ListingCreate
    valid: false
    note: total_price 必須 ≥ 1
    data:
      source_code: SRC-591
      external_id: '1'
      snapshot: { total_price: 0 }

  # ---------------- PATCH 語意 ----------------
  - id: C-PATCH-01
    schema: ListingPatch
    valid: true
    note: null 代表清除可以為 null 的欄位
    data: { url: null }
  - id: C-PATCH-02
    schema: ListingPatch
    valid: false
    note: lister_type 不可為 null
    data: { lister_type: null }
  - id: C-PATCH-03
    schema: ListingPatch
    valid: false
    note: 空的 patch 不允許
    data: {}
  - id: C-PATCH-04
    schema: ListingPatch
    valid: false
    note: 未定義欄位
    data: { status: DELISTED }
  - id: C-PATCH-05
    schema: AlertRulePatch
    valid: true
    note: 清除價格門檻
    data: { max_total_price: null }
  - id: C-PATCH-06
    schema: AlertRulePatch
    valid: false
    note: enabled 不可為 null
    data: { enabled: null }

  # ---------------- ReviewDecision ----------------
  - id: C-RD-01
    schema: ReviewDecision
    valid: true
    note: SET_UNIT，附直接門牌證據與刊登連結證據（對應 T-ADDR-09a；是否充分由伺服器判定）
    data:
      decision: SET_UNIT
      address_unit_id: 302
      rationale: 由刊登 591#123456 的仲介帶看，現場門牌 79 號 12 樓
      new_evidence:
        - { field: full_address, value: { address_text: 高鐵南路一段79號12樓 }, description: 現場門牌照片（只存描述與雜湊）, observed_at: '2026-11-01T06:00:00Z', evidence_role: DIRECT_ADDRESS, derivation_type: ORIGINAL, capture: *photo_capture, asserting_party: *user_party, content_hash: 'sha256:9f1c' }
        - { field: listing_identity, value: { listing_id: 11 }, description: 帶看仲介出示的刊登編號與看房單, observed_at: '2026-11-01T06:00:00Z', evidence_role: LISTING_LINKAGE, derivation_type: ORIGINAL, capture: *visit_capture, asserting_party: *user_party, link_method: AGENT_VIEWING_WITH_LISTING_REF, linked_listing: { listing_id: 11, listing_ref_seen: '591#123456' } }
  - id: C-RD-02
    schema: ReviewDecision
    valid: false
    note: SET_UNIT 缺少 address_unit_id
    data: { decision: SET_UNIT, rationale: 看起來是這戶, evidence_ids: [5] }
  - id: C-RD-03
    schema: ReviewDecision
    valid: false
    note: SET_UNIT 的 address_unit_id 為 null
    data: { decision: SET_UNIT, address_unit_id: null, rationale: 看起來是這戶, evidence_ids: [5] }
  - id: C-RD-04
    schema: ReviewDecision
    valid: false
    note: 確認類決定沒有附佐證（按下確認不等於真值）
    data: { decision: CONFIRM_CANDIDATE, candidate_id: 9, rationale: 我覺得是這戶 }
  - id: C-RD-05
    schema: ReviewDecision
    valid: false
    note: evidence_ids 是空陣列，不算佐證
    data: { decision: CONFIRM_CANDIDATE, candidate_id: 9, rationale: 我覺得是這戶, evidence_ids: [] }
  - id: C-RD-06
    schema: ReviewDecision
    valid: true
    note: 棄答只需要理由
    data: { decision: ABSTAIN, rationale: 三戶坪型相同，照片無法區分 }
  - id: C-RD-07
    schema: ReviewDecision
    valid: false
    note: 棄答也必須有理由
    data: { decision: ABSTAIN }
  - id: C-RD-08
    schema: ReviewDecision
    valid: true
    note: 確認同屋，引用既有證據
    data: { decision: CONFIRM_SAME, rationale: 兩則刊登的室內照片完全相同, evidence_ids: [701, 702] }
  - id: C-RD-09
    schema: ReviewDecision
    valid: false
    note: 未定義的 decision
    data: { decision: APPROVE, rationale: 未定義的決定類型 }
  - id: C-RD-10
    schema: ReviewDecision
    valid: true
    note: schema 合法，但只有地址文字、沒有刊登連結 → 伺服器判定 INSUFFICIENT（T-ADDR-09b）；schema 合法不等於佐證充分
    data:
      decision: SET_UNIT
      address_unit_id: 302
      rationale: 應該是 79 號 12 樓
      new_evidence:
        - { field: full_address, value: { address_text: 高鐵南路一段79號12樓 }, description: 使用者輸入的地址文字, observed_at: '2026-11-01T06:00:00Z', evidence_role: OTHER, derivation_type: ORIGINAL, capture: { captured_by: user, captured_at: '2026-11-01T06:00:00Z', method: OTHER } }
  - id: C-RD-11
    schema: ReviewDecision
    valid: true
    note: 驗證推導規則（附佐證）
    data: { decision: VERIFY_RULE, rationale: 樂居銷控表逐層列出 2–24 樓，每戶別的號碼一致, evidence_ids: [1201] }
  - id: C-RD-12
    schema: ReviewDecision
    valid: false
    note: VERIFY_RULE 沒有佐證
    data: { decision: VERIFY_RULE, rationale: 看起來規則正確 }

  # ---------------- UserEvidenceInput（佐證結構） ----------------
  - id: C-UE-01
    schema: UserEvidenceInput
    valid: false
    note: LISTING_LINKAGE 沒有 link_method 與 linked_listing
    data: { field: listing_identity, value: { listing_id: 11 }, description: 我確定就是這間, observed_at: '2026-11-01T06:00:00Z', evidence_role: LISTING_LINKAGE, derivation_type: ORIGINAL, capture: *visit_capture }
  - id: C-UE-02
